<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ArtBooth Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== THEME: swap only this block to change palette ===== */
        :root {
            --ab-primary: #FF6B6B;
            --ab-primary-dark: #E85A5A;
            --ab-on-primary: #2D2A32;
            --ab-accent: #FFC857;
            --ab-bg: #FFF8F0;
            --ab-text: #2D2A32;
            --ab-nav-bg: #4A2C5A;
            --ab-link: #4A2C5A;
        }
        /* ===== END THEME ===== */

        body { background-color: var(--ab-bg); color: var(--ab-text); }
        .ab-navbar { background-color: var(--ab-nav-bg); }
        main a:not(.btn) { color: var(--ab-link); }

        .btn-primary {
            --bs-btn-color: var(--ab-on-primary);
            --bs-btn-bg: var(--ab-primary);
            --bs-btn-border-color: var(--ab-primary);
            --bs-btn-hover-color: var(--ab-on-primary);
            --bs-btn-hover-bg: var(--ab-primary-dark);
            --bs-btn-hover-border-color: var(--ab-primary-dark);
            --bs-btn-active-color: var(--ab-on-primary);
            --bs-btn-active-bg: var(--ab-primary-dark);
            --bs-btn-active-border-color: var(--ab-primary-dark);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--ab-primary);
            box-shadow: 0 0 0 .25rem rgba(0, 0, 0, .08);
        }

        .card {
            border: 0;
            border-top: 4px solid var(--ab-accent);
            border-radius: .75rem;
        }

        .role-badge { font-weight: 600; }
        .role-owner { background-color: var(--ab-primary); color: var(--ab-on-primary); }
        .role-assistant { background-color: var(--ab-accent); color: var(--ab-text); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark ab-navbar">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">ArtBooth Manager</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <span class="badge role-badge role-{{ user.role|lower }}">{{ user.get_role_display }}</span>
                <a class="btn btn-outline-light btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'profile' %}">Profile</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light btn-sm">Log out</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
                <a class="btn btn-light btn-sm" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container my-4">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
