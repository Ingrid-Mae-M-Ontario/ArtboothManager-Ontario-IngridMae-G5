{% extends "base.html" %}
{% block title %}Record Sale{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm"><div class="card-body p-4">
            <h2 class="mb-1">Record a sale</h2>
            <p class="text-muted">{{ event.name }}. Enter a quantity for each item sold.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "accounts/_form.html" %}
                <button class="btn btn-primary w-100">Save sale</button>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
