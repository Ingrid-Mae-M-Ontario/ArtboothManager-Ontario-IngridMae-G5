{% extends "base.html" %}
{% block title %}Record Sale{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="mb-1">Record a Sale</h2>
                <p class="text-muted mb-4">{{ event.name }}</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "accounts/_form.html" %}
                    <button type="submit" class="btn btn-primary">Record sale</button>
                    <a class="btn btn-outline-secondary" href="{% url 'booth:sales_list' event.pk %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
